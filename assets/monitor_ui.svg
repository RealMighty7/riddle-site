<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
  <!-- Bezel -->
  <rect width="1920" height="1080" fill="#07090e" fill-opacity="0.92"/>

  <!-- Inner bezel edge -->
  <rect x="92" y="64" width="1736" height="952" rx="32" fill="none" stroke="#e2e8f0" stroke-opacity="0.06" stroke-width="4"/>

  <!-- Screen glass -->
  <rect x="130" y="105" width="1660" height="870" rx="22" fill="#0b1220" fill-opacity="0.28"/>
  <rect x="130" y="105" width="1660" height="870" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Minimal HUD notches -->
  <path d="M150 135 H230" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <path d="M1690 135 H1770" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
