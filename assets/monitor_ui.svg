  <path d="M1760 925 V950 H1735" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" fill="none"/>

  <!-- Faint scanline block -->
  <g opacity="0.07">
    <rect x="130" y="145" width="1660" height="2" fill="#ffffff"/>
    <rect x="130" y="245" width="1660" height="2" fill="#ffffff"/>
    <rect x="130" y="345" width="1660" height="2" fill="#ffffff"/>
    <rect x="130" y="445" width="1660" height="2" fill="#ffffff"/>
    <rect x="130" y="545" width="1660" height="2" fill="#ffffff"/>
    <rect x="130" y="645" width="1660" height="2" fill="#ffffff"/>
    <rect x="130" y="745" width="1660" height="2" fill="#ffffff"/>
    <rect x="130" y="845" width="1660" height="2" fill="#ffffff"/>
  </g>
