<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd9ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#cfd9ff" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="screenEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aebcff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#aebcff" stop-opacity=".06"/>
    </linearGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#cfe0ff" opacity=".06"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer bezel -->
  <rect x="30" y="30" width="1540" height="840" rx="28" fill="none" stroke="url(#bezel)" stroke-width="4" filter="url(#glow)"/>
  <rect x="48" y="48" width="1504" height="804" rx="22" fill="none" stroke="rgba(207,217,255,.18)" stroke-width="2"/>

  <!-- inner screen edge -->
  <rect x="90" y="86" width="1420" height="728" rx="18" fill="none" stroke="url(#screenEdge)" stroke-width="2"/>
  <rect x="98" y="94" width="1404" height="712" rx="16" fill="url(#scan)" opacity=".85"/>

  <!-- subtle HUD notches -->
  <g opacity=".22" stroke="#dbe6ff" stroke-width="2">
    <path d="M120 140 h80" />
    <path d="M1400 140 h80" />
    <path d="M120 760 h80" />
    <path d="M1400 760 h80" />
  </g>

  <!-- corner screws -->
  <g opacity=".22" fill="#dbe6ff">
    <circle cx="78" cy="74" r="4"/>
    <circle cx="1522" cy="74" r="4"/>
    <circle cx="78" cy="826" r="4"/>
    <circle cx="1522" cy="826" r="4"/>
  </g>
</svg>
