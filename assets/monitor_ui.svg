  <path d="M1690 945 H1770" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Corner brackets -->
  <path d="M160 155 V130 H185" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none"/>
  <path d="M1760 155 V130 H1735" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none"/>
