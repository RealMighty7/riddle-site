<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>index</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>▢</text></svg>">
  <link rel="stylesheet" href="/styles.css?v=200" />
</head>

<body>
  <!-- overlays -->
  <div id="glassFX"></div>

  <!-- PNG CRACK OVERLAY -->
  <div id="cracks" aria-hidden="true">
    <img id="cracksImg" alt="">
  </div>

  <main id="wrap">
    <!-- your landing UI -->
    <!-- (keep your existing content here) -->
  </main>

  <!-- SIM -->
  <section id="simRoom" class="hidden">
    <div class="simCard card">
      <pre id="simText" class="simText"></pre>
      <div id="simChoices" class="simChoices hidden">
        <button id="choiceNeed" class="sim-btn">Okay.</button>
        <button id="choiceLie" class="sim-btn">Sure.</button>
        <button id="choiceRun" class="sim-btn">Run.</button>
      </div>
    </div>
  </section>

  <!-- TASK UI -->
  <section id="taskUI" class="hidden">
    <div class="taskCard card">
      <h1 id="taskTitle">TASK</h1>
      <p id="taskDesc" class="taskDesc"></p>
      <div id="taskBody" class="taskBody"></div>
      <div id="taskActions" class="taskActions">
        <button id="taskPrimary" class="sim-btn">Continue</button>
        <button id="taskSecondary" class="sim-btn hidden">Alt</button>
      </div>
    </div>
  </section>

  <!-- RESET -->
  <section id="resetOverlay" class="hidden">
    <div class="resetCard card">
      <h1 id="resetTitle">RESET</h1>
      <div id="resetBody" class="resetBody"></div>
    </div>
  </section>

  <!-- FINAL -->
  <section id="finalOverlay" class="hidden">
    <div class="finalCard card">
      <input id="finalDiscord" placeholder="discord" />
      <div id="turnstileBox"></div>
      <div class="btnRow">
        <button id="finalVerify" class="sim-btn">verify</button>
        <button id="finalCancel" class="sim-btn">cancel</button>
      </div>
      <div id="finalErr" class="errText"></div>
    </div>
  </section>

  <!-- subtitles -->
  <section id="subs" class="hidden">
    <div id="subsName"></div>
    <div id="subsText"></div>
  </section>

  <!-- admin / hack rooms (keep your existing markup + ids) -->
  <section id="hackRoom" class="hidden"></section>
  <section id="adminPanel" class="hidden"></section>

  <!-- IMPORTANT script order -->
  <script src="/dialogue.js?v=200"></script>
  <script src="/tasks.js?v=200"></script>

  <script src="/audio_player.js?v=200"></script>
  <script src="/ttsQueue.js?v=200"></script>

  <script src="/main.js?v=200"></script>
</body>
</html>
